server {
    listen 80;
    listen [::]:80;
    server_name laborin.app www.laborin.app mx.laborin.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name laborin.app www.laborin.app;

    ssl_certificate     /etc/letsencrypt/live/laborin.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/laborin.app/privkey.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 50m;

    location = /webmail {
        return 301 https://laborin-webmail.laborin.app/;
    }

    location /webmail/ {
        return 301 https://laborin-webmail.laborin.app/;
    }

    # App frontend (pendiente):
    # location / {
    #     proxy_pass http://app-frontend:3000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto https;
    # }

    # App backend (pendiente):
    location /api/ {
        return 404;
    }
}
